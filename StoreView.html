<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store Preview — Tedd Grooming</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    background: #080808;
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 20px 12px;
    text-align: center;
  }

  .brand-logo {
    width: 160px;
    height: auto;
  }

  .brand-sub {
    font-size: 11px;
    font-weight: 600;
    color: #888;
    letter-spacing: 2px;
    margin-top: 6px;
    text-transform: uppercase;
  }

  #scene-container {
    width: 100%;
    flex: 1;
    position: relative;
  }

  #scene-container canvas {
    display: block;
  }

  #fallback-message {
    display: none;
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #888;
    font-size: 13px;
    padding: 20px;
  }

  #fallback-message.show { display: flex; }
</style>
</head>
<body>

  <div class="brand">
    <img class="brand-logo" src="shop/images/tedd-logo.png" alt="Tedd Grooming">
    <div class="brand-sub">Store Layout Preview</div>
  </div>

  <div id="scene-container">
    <div id="fallback-message">3D preview unavailable — check your connection and reload.</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const ROOM_WIDTH = 12;
    const ROOM_DEPTH = 9;
    const ROOM_HEIGHT = 3.5;

    const container = document.getElementById('scene-container');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080808);

    const camera = new THREE.PerspectiveCamera(55, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(8, 7, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1, 0);
    controls.enableDamping = true;
    controls.zoomSpeed = 5;
    controls.enablePan = true;
    controls.screenSpacePanning = true;
    controls.panSpeed = 1.5;
    controls.mouseButtons = {
      LEFT: THREE.MOUSE.ROTATE,
      MIDDLE: THREE.MOUSE.DOLLY,
      RIGHT: THREE.MOUSE.PAN
    };
    controls.minDistance = 4;
    controls.maxDistance = 22;
    controls.maxPolarAngle = Math.PI / 2.05;
    controls.keys = { LEFT: 'ArrowLeft', UP: 'ArrowUp', RIGHT: 'ArrowRight', BOTTOM: 'ArrowDown' };
    controls.listenToKeyEvents(window);
    controls.keyPanSpeed = 25;
    controls.update();

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.55);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xfff4d6, 0.9);
    keyLight.position.set(8, 10, 6);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xaab8ff, 0.35);
    fillLight.position.set(-6, 5, -4);
    scene.add(fillLight);

    const room = new THREE.Group();
    scene.add(room);

    const textureLoader = new THREE.TextureLoader();

    function loadTiledTexture(url, repeatX, repeatY) {
      const texture = textureLoader.load(url);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(repeatX, repeatY);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    function makeSmokeyTileTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#6e6e72';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Subtle smokey mottling
      for (let i = 0; i < 60; i++) {
        const shade = 90 + Math.floor(Math.random() * 30);
        ctx.fillStyle = `rgba(${shade},${shade},${shade + 2},0.15)`;
        const size = 20 + Math.random() * 40;
        ctx.beginPath();
        ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, size, 0, Math.PI * 2);
        ctx.fill();
      }

      // Tile grout lines (4x4 grid)
      ctx.strokeStyle = 'rgba(40,40,42,0.8)';
      ctx.lineWidth = 3;
      const cell = canvas.width / 4;
      for (let i = 0; i <= 4; i++) {
        ctx.beginPath();
        ctx.moveTo(i * cell, 0);
        ctx.lineTo(i * cell, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * cell);
        ctx.lineTo(canvas.width, i * cell);
        ctx.stroke();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(ROOM_WIDTH / 2, ROOM_DEPTH / 2);
      return texture;
    }

    const floorTexture = makeSmokeyTileTexture();
    const floorMaterial = new THREE.MeshStandardMaterial({ map: floorTexture, roughness: 0.6 });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_WIDTH, ROOM_DEPTH), floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    room.add(floor);

    const wallMaterial = new THREE.MeshStandardMaterial({ color: 0xf5f5f0, roughness: 0.85 });
    const ENTRANCE_WIDTH = 2.4;

    const backWall = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_WIDTH, ROOM_HEIGHT), wallMaterial);
    backWall.position.set(0, ROOM_HEIGHT / 2, -ROOM_DEPTH / 2);
    room.add(backWall);

    const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_DEPTH, ROOM_HEIGHT), wallMaterial);
    leftWall.position.set(-ROOM_WIDTH / 2, ROOM_HEIGHT / 2, 0);
    leftWall.rotation.y = Math.PI / 2;
    room.add(leftWall);

    const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_DEPTH, ROOM_HEIGHT), wallMaterial);
    rightWall.position.set(ROOM_WIDTH / 2, ROOM_HEIGHT / 2, 0);
    rightWall.rotation.y = -Math.PI / 2;
    room.add(rightWall);

    // Front wall has a gap (entrance) in the middle, built from two side segments.
    const frontSegmentWidth = (ROOM_WIDTH - ENTRANCE_WIDTH) / 2;
    const frontLeftSegment = new THREE.Mesh(new THREE.PlaneGeometry(frontSegmentWidth, ROOM_HEIGHT), wallMaterial);
    frontLeftSegment.position.set(-(ENTRANCE_WIDTH / 2 + frontSegmentWidth / 2), ROOM_HEIGHT / 2, ROOM_DEPTH / 2);
    frontLeftSegment.rotation.y = Math.PI;
    room.add(frontLeftSegment);

    const frontRightSegment = new THREE.Mesh(new THREE.PlaneGeometry(frontSegmentWidth, ROOM_HEIGHT), wallMaterial);
    frontRightSegment.position.set(ENTRANCE_WIDTH / 2 + frontSegmentWidth / 2, ROOM_HEIGHT / 2, ROOM_DEPTH / 2);
    frontRightSegment.rotation.y = Math.PI;
    room.add(frontRightSegment);

    function makeLabelSprite(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(8,8,8,0.75)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = 'bold 28px Inter, sans-serif';
      ctx.fillStyle = '#c8a84b';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);

      const texture = new THREE.CanvasTexture(canvas);
      const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set(1.6, 0.4, 1);
      return sprite;
    }

    function addLabel(text, position) {
      const sprite = makeLabelSprite(text);
      sprite.position.copy(position);
      room.add(sprite);
    }

    // Counter near the entrance — glass table
    const counterGlassMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xeaf6f6,
      transmission: 1,
      transparent: true,
      opacity: 1,
      roughness: 0.05,
      thickness: 0.3,
      ior: 1.5,
      metalness: 0,
    });
    const counterBaseMaterial = counterGlassMaterial;
    const counterTopMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xeaf6f6,
      transmission: 1,
      transparent: true,
      opacity: 1,
      roughness: 0.02,
      thickness: 0.1,
      ior: 1.5,
      metalness: 0,
    });

    const counterBase = new THREE.Mesh(new THREE.BoxGeometry(3, 1, 0.8), counterBaseMaterial);
    counterBase.position.set(0, 0.5, ROOM_DEPTH / 2 - 1.4);
    room.add(counterBase);

    const counterTop = new THREE.Mesh(new THREE.BoxGeometry(3.1, 0.08, 0.9), counterTopMaterial);
    counterTop.position.set(0, 1.04, ROOM_DEPTH / 2 - 1.4);
    room.add(counterTop);

    addLabel('Counter', new THREE.Vector3(0, 1.8, ROOM_DEPTH / 2 - 1.4));

    // Shelves along the back and side walls
    const shelfWoodTexture = loadTiledTexture('https://threejs.org/examples/textures/hardwood2_diffuse.jpg', 1, 1);
    const shelfBaseMaterial = new THREE.MeshStandardMaterial({ map: shelfWoodTexture, color: 0x4a3a28, roughness: 0.8 });
    const shelfEdgeMaterial = new THREE.MeshStandardMaterial({ color: 0xc8a84b, roughness: 0.35, metalness: 0.4 });

    function addShelf(x, z, rotationY, label) {
      const shelf = new THREE.Group();

      const base = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.6, 0.5), shelfBaseMaterial);
      base.position.y = 0.8;
      shelf.add(base);

      const edge = new THREE.Mesh(new THREE.BoxGeometry(2.45, 0.06, 0.52), shelfEdgeMaterial);
      edge.position.y = 1.6;
      shelf.add(edge);

      shelf.position.set(x, 0, z);
      shelf.rotation.y = rotationY;
      room.add(shelf);

      addLabel(label, new THREE.Vector3(x, 2.3, z + (rotationY === 0 ? 0.4 : 0)));
    }

    addShelf(-4, -ROOM_DEPTH / 2 + 0.3, 0, 'Pomade');
    addShelf(0, -ROOM_DEPTH / 2 + 0.3, 0, 'Hair Spray');
    addShelf(4, -ROOM_DEPTH / 2 + 0.3, 0, 'Styling Clay');
    addShelf(-ROOM_WIDTH / 2 + 0.3, -2, Math.PI / 2, 'Grooming Tools');

    let loadCheckTimer = setTimeout(() => {
      const canvasExists = container.querySelector('canvas');
      if (!canvasExists) {
        document.getElementById('fallback-message').classList.add('show');
      }
    }, 4000);

    window.addEventListener('error', () => {
      document.getElementById('fallback-message').classList.add('show');
    });

    function resize() {
      const width = container.clientWidth;
      const height = container.clientHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }
    window.addEventListener('resize', resize);
    window.addEventListener('load', resize);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>

</body>
</html>
