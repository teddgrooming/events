<title>Tedd Grooming</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { background: #0a0806; }

  body {
    min-height: 100vh;
    color: #e9e1d2;
    font-family: 'Work Sans', 'Segoe UI', system-ui, sans-serif;
    position: relative;
    overflow-x: hidden;
  }

  /* ── Register call-to-action under the photo ── */
  .register-cta { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 28px; padding: 16px 18px; background: #1a1612; color: #ffffff; text-decoration: none; border-radius: 4px; }
  .register-kicker { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #c8a84b; white-space: nowrap; }
  .register-title { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 16px; letter-spacing: .06em; text-transform: uppercase; flex: 1; }
  .register-arrow { font-size: 18px; color: #c8a84b; }
  /* ── Floating Register Now button on the photo ── */
  .float-register { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 4; display: inline-block; padding: 14px 26px; background: #c8a84b; color: #0a0806; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; text-decoration: none; border-radius: 999px; box-shadow: 0 10px 22px rgba(0,0,0,0.7); white-space: nowrap; }
  .float-register:active { transform: translate(-50%, -50%) scale(0.97); }
  /* ── Top-left menu ── */
  .menu-wrap { position: absolute; top: 12px; left: 12px; z-index: 5; }
  .menu-btn { width: 40px; height: 40px; border-radius: 6px; border: 0; cursor: pointer; padding: 0; background: rgba(10,8,6,0.7); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; }
  .menu-btn span { display: block; width: 20px; height: 2px; background: #ffffff; border-radius: 1px; }
  .menu-panel { position: absolute; top: 48px; left: 0; width: 250px; max-height: calc(100vh - 90px); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; background: #14110d; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,0.18); padding: 2px 16px 6px; }
  .menu-panel[hidden] { display: none; }
  .menu-panel details { border-bottom: 1px solid rgba(255,255,255,0.08); }
  .menu-panel details:last-child { border-bottom: none; }
  .menu-panel summary { list-style: none; cursor: pointer; padding: 10px 0; font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: #c8a84b; }
  .menu-panel summary::-webkit-details-marker { display: none; }
  .menu-links { padding-bottom: 4px; }
  .menu-link { display: block; padding: 7px 0; font-family: 'Work Sans', system-ui, sans-serif; font-size: 14px; font-weight: 600; color: #e9e1d2; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.07); }
  .menu-link:last-child { border-bottom: none; }
  #register { width: 100vw; margin: 0 0 40px calc(50% - 50vw); }
  .register-frame { width: 100%; height: 900px; border: 0; display: block; }

  /* ── Ambient glow (replaces the old animated grid — calmer, pricier) ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 55% 35% at 18% 8%, rgba(200,168,75,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 45% 30% at 85% 75%, rgba(200,168,75,0.04) 0%, transparent 55%);
    animation: bgPulse 9s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes bgPulse { 0% { opacity: .55; } 100% { opacity: 1; } }

  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* ── Hero (full-bleed) ── */
  .hero {
    position: relative;
    width: 100%;
    height: auto;
    overflow: hidden;
  }
  .hero-img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 8%;
    display: block;
    filter: brightness(0.78) saturate(0.96);
  }
  .hero-photo {
    position: relative;
    width: 100%; height: auto;
    display: block;
  }
  .hero-scrim {
    display: none;
  }
  .hero-content {
    position: absolute; left: 0; right: 0; top: 10px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .hero-logo {
    width: 137px; height: auto;
    filter: none;
  }
  .hero-tagline {
    font-size: 11px; letter-spacing: .3em; text-transform: uppercase;
    color: #c8a84b;
  }

  /* ── Page column ── */
  .page { max-width: 440px; margin: 0 auto; padding: 36px 22px 64px; position: relative; z-index: 1; }

  .rule { width: 56px; height: 1px; background: linear-gradient(90deg, transparent, #8a6d1f, transparent); margin: 0 auto 36px; }

  .section-label {
    font-size: 10.5px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase;
    color: #c8a84b; margin-bottom: 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-label::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,.08); }
  .section-label.full { margin: 44px 0 16px; }

  /* ── Follow / Find — minimal index rows, no card chrome ── */
  .two-col { display: flex; gap: 26px; }
  .col { flex: 1; min-width: 0; }

  .link-row {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 0;
    border-bottom: 1px solid rgba(255,255,255,.07);
    text-decoration: none; color: #e9e1d2;
    transition: opacity .2s ease;
  }
  .col .link-row:last-child { border-bottom: none; }
  .link-row:hover { opacity: .62; }
  .link-row:active { opacity: .45; }
  .link-row .icon { width: 17px; height: 17px; flex-shrink: 0; display: flex; }
  .link-row .label { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
  .link-row.loading { opacity: .4; pointer-events: none; }

  /* ── Featured (Events) ── */
  .featured {
    display: block; text-decoration: none; color: inherit;
    border: 1px solid rgba(200,168,75,.3);
    background: linear-gradient(135deg, rgba(200,168,75,.08), rgba(200,168,75,.015));
    border-radius: 3px;
    padding: 22px 20px;
    margin-bottom: 12px;
    transition: border-color .2s ease, transform .2s ease;
  }
  .featured:hover { border-color: rgba(200,168,75,.65); transform: translateY(-2px); }
  .featured-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .featured-badge {
    font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: #c8a84b;
    background: rgba(200,168,75,.12); padding: 4px 9px; border-radius: 2px; font-weight: 600;
  }
  .featured-arrow { color: #c8a84b; font-size: 15px; }
  .featured-title { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 23px; text-transform: uppercase; letter-spacing: .01em; margin-bottom: 5px; }
  .featured-sub { font-size: 12px; color: #938a7b; line-height: 1.5; }

  /* ── Tools grid ── */
  .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tool-tile {
    display: flex; flex-direction: column; gap: 14px;
    padding: 18px 16px;
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(255,255,255,.015);
    border-radius: 3px;
    text-decoration: none; color: #e9e1d2;
    transition: border-color .2s ease, background .2s ease, transform .2s ease;
  }
  .tool-tile:hover { border-color: rgba(200,168,75,.4); background: rgba(200,168,75,.04); transform: translateY(-2px); }
  .tool-tile .icon-wrap {
    width: 40px; height: 40px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .tool-tile .label { font-size: 11.5px; font-weight: 600; letter-spacing: .03em; line-height: 1.35; }

  .icon-catalog, .icon-quiz, .icon-game, .icon-draw { background: radial-gradient(circle at 30% 30%, rgba(200,168,75,0.26), rgba(200,168,75,0.05)); }
  .catalog-spark { animation: twinkle 2s ease-in-out infinite; transform-origin: center; }
  .quiz-spark   { animation: twinkle 1.8s ease-in-out infinite; transform-origin: center; }
  .quiz-spark:nth-child(2) { animation-delay: .3s; }
  .quiz-spark:nth-child(3) { animation-delay: .6s; }
  .game-spark   { animation: twinkle 1.8s ease-in-out infinite; transform-origin: center; }
  .game-spark:nth-child(4) { animation-delay: .2s; }
  .game-spark:nth-child(5) { animation-delay: .4s; }
  .game-spark:nth-child(6) { animation-delay: .6s; }
  .game-spark:nth-child(7) { animation-delay: .8s; }
  .game-spark:nth-child(8) { animation-delay: 1s; }
  .draw-spark   { animation: twinkle 1.8s ease-in-out infinite; transform-origin: center; }
  .draw-spark:nth-child(5) { animation-delay: .3s; }
  @keyframes twinkle { 0%, 100% { opacity: .28; } 50% { opacity: 1; } }

  /* ── Footer ── */
  .footer { margin-top: 50px; text-align: center; font-size: 9px; letter-spacing: .2em; color: #3a352c; text-transform: uppercase; }

  /* ── Entry animation ── */
  .page > * { animation: fadeUp .6s ease both; }
  .two-col { animation-delay: .08s; }
  .section-label.full { animation-delay: .12s; }
  .tools-wrap { animation-delay: .16s; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
</style>

  <script>
    function handleWebsite(el) {
      el.classList.add('loading');
      setTimeout(() => el.classList.remove('loading'), 4000);
    }

    function openApp(e, iosScheme, androidIntent, webUrl) {
      e.preventDefault();
      const ua = navigator.userAgent;
      const isAndroid = /Android/i.test(ua);
      const isIOS = /iPhone|iPad|iPod/i.test(ua);

      if (!isAndroid && !isIOS) {
        window.open(webUrl, '_blank', 'noopener');
        return;
      }

      if (isAndroid && androidIntent) {
        window.location.href = androidIntent;
        return;
      }

      if (isIOS && iosScheme) {
        let appOpened = false;
        const onBlur = () => { appOpened = true; };
        window.addEventListener('blur', onBlur, { once: true });
        setTimeout(() => {
          window.removeEventListener('blur', onBlur);
          if (!appOpened) window.location.href = webUrl;
        }, 650);
        window.location.href = iosScheme;
        return;
      }

      window.location.href = webUrl;
    }

    function openWhatsApp(e, phone, webUrl) {
      e.preventDefault();
      const ua = navigator.userAgent;
      const isAndroid = /Android/i.test(ua);
      const isIOS = /iPhone|iPad|iPod/i.test(ua);

      if (!isAndroid && !isIOS) {
        window.open(webUrl, '_blank', 'noopener');
        return;
      }

      let appOpened = false;
      const onHide = () => { appOpened = true; };
      window.addEventListener('blur', onHide, { once: true });
      document.addEventListener('visibilitychange', onHide, { once: true });
      setTimeout(() => {
        window.removeEventListener('blur', onHide);
        document.removeEventListener('visibilitychange', onHide);
        if (!appOpened) window.location.href = webUrl;
      }, 650);
      window.location.href = `whatsapp://send?phone=${phone}`;
    }
  </script>

<script>
  (function () {
    var btn = document.querySelector('.menu-btn');
    var panel = document.getElementById('menuPanel');
    btn.addEventListener('click', function () {
      var open = panel.hasAttribute('hidden');
      if (open) { panel.removeAttribute('hidden'); } else { panel.setAttribute('hidden', ''); }
      btn.setAttribute('aria-expanded', String(open));
    });
  })();
</script>
